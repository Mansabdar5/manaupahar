<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ManaUpahar – Where Every Gift Carries a Memory</title>
<meta name="description" content="Beautiful gifts for every occasion. Pick your gift and order instantly on WhatsApp.">
<meta name="theme-color" content="#f97316">
<link rel="icon" href="favicon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="topbar"><div class="container">
  <a class="brand" href="/" id="brand"></a>
  <button class="cart-btn" id="openCart" aria-label="Open cart">🛒 Cart <span class="badge" id="count">0</span></button>
</div></div>

<section class="hero"><div class="container">
  <h1>Where Every Gift <span>Carries a Memory</span></h1>
  <p>Choose a gift for any occasion and place your order directly on WhatsApp. Simple, personal and quick.</p>
  <div class="search"><input id="q" type="search" placeholder="Search gifts…" aria-label="Search gifts"></div>
  <div class="how"><span>Pick your gifts</span><span>Send order on WhatsApp</span><span>We confirm &amp; deliver</span></div>
</div></section>

<main class="container">
  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"><div class="empty">Loading gifts…</div></div>
</main>

<footer class="foot">
  <strong>ManaUpahar</strong> – Where Every Gift Carries a Memory<br>
  <span id="footNote"></span>
</footer>

<div class="overlay" id="ov"></div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <button class="x" id="closeModal" aria-label="Close">×</button>
  <img id="mImg" alt="">
  <div class="info">
    <span class="note" id="mCat"></span>
    <h2 id="mName" style="margin:0;color:var(--navy)"></h2>
    <div class="price" id="mPrice"></div>
    <p id="mDesc" style="margin:0;color:var(--muted)"></p>
    <div class="actions" style="margin-top:auto">
      <button class="btn btn-o" id="mAdd">Add to cart</button>
      <a class="btn btn-g" id="mWa" target="_blank" rel="noopener">Order on WhatsApp</a>
    </div>
  </div>
</div>

<aside class="drawer" id="drawer" aria-label="Your cart">
  <header>Your cart <button class="x" id="closeCart" aria-label="Close">×</button></header>
  <div class="items" id="items"></div>
  <footer>
    <div class="total"><span>Total</span><span id="total">₹0</span></div>
    <button class="btn btn-g" id="send" style="padding:14px">Send order on WhatsApp</button>
    <div class="note" id="note"></div>
  </footer>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = MU.esc, money = MU.money;
let products = [], settings = {}, cat = 'All', term = '';
let cart = {};
try { cart = JSON.parse(localStorage.getItem('mu_cart') || '{}'); } catch (e) {}
const saveCart = () => { try { localStorage.setItem('mu_cart', JSON.stringify(cart)); } catch (e) {} };
const byId = id => products.find(p => String(p.id) === String(id));

$('#brand').innerHTML = MU.logoHTML();

function waLink(text) { return 'https://wa.me/' + String(settings.whatsapp || '').replace(/\D/g, '') + '?text=' + encodeURIComponent(text); }
function singleMsg(p) {
  return 'Hello ManaUpahar! 🎁\nI would like to order:\n\n' + p.name + ' – ' + money(p.price) + '\n\nMy name:\nDelivery address:\nDelivery date:';
}

function renderCats() {
  const list = ['All', ...new Set(products.map(p => p.category).filter(Boolean))];
  $('#cats').innerHTML = list.map(c => '<button class="chip ' + (c === cat ? 'on' : '') + '" data-c="' + esc(c) + '">' + esc(c) + '</button>').join('');
}
function renderGrid() {
  const t = term.trim().toLowerCase();
  const list = products.filter(p => (cat === 'All' || p.category === cat) &&
    (!t || (p.name + ' ' + (p.description || '') + ' ' + p.category).toLowerCase().includes(t)));
  if (!list.length) { $('#grid').innerHTML = '<div class="empty">No gifts found here yet. Try another category.</div>'; return; }
  $('#grid').innerHTML = list.map(p => {
    const left = MU.stockOf(p), out = left === 0;
    return '<article class="card"><div class="img" data-view="' + esc(p.id) + '">' +
      '<img loading="lazy" src="' + esc(p.image_url || '') + '" alt="' + esc(p.name) + '">' +
      '<span class="tag">' + esc(p.category) + '</span>' + (out ? '<div class="sold">SOLD OUT</div>' : (left <= 3 ? '<span class="low-tag">Only ' + left + ' left</span>' : '')) + '</div>' +
      '<div class="body"><h3>' + esc(p.name) + '</h3><div class="price">' + money(p.price) + '</div>' +
      '<div class="actions"><button class="btn btn-o" data-add="' + esc(p.id) + '" ' + (out ? 'disabled' : '') + '>Add to cart</button>' +
      '<a class="btn btn-g" ' + (out ? 'aria-disabled="true" style="opacity:.5;pointer-events:none"' : 'href="' + esc(waLink(singleMsg(p))) + '" target="_blank" rel="noopener"') + '>Order now</a></div></div></article>';
  }).join('');
}
function cartEntries() { return Object.keys(cart).map(id => { const p = byId(id); return { p, q: p ? Math.min(cart[id], MU.stockOf(p)) : 0 }; }).filter(e => e.p && e.q > 0); }
function renderCart() {
  const es = cartEntries();
  const n = es.reduce((a, e) => a + e.q, 0), total = es.reduce((a, e) => a + e.q * Number(e.p.price), 0);
  $('#count').textContent = n; $('#total').textContent = money(total);
  $('#send').disabled = !n;
  $('#items').innerHTML = es.length ? es.map(e => '<div class="line"><img src="' + esc(e.p.image_url || '') + '" alt="">' +
    '<div><div class="n">' + esc(e.p.name) + '</div><div class="qty"><button data-dec="' + esc(e.p.id) + '">−</button><span>' + e.q + '</span><button data-inc="' + esc(e.p.id) + '"' + (e.q >= MU.stockOf(e.p) ? ' disabled title="No more in stock"' : '') + '>+</button></div></div>' +
    '<strong>' + money(e.q * Number(e.p.price)) + '</strong></div>').join('') : '<div class="empty" style="padding:40px 0">Your cart is empty.</div>';
}
function change(id, d) { const p = byId(id), max = p ? MU.stockOf(p) : 0; cart[id] = Math.min(max, Math.max(0, (cart[id] || 0) + d)); if (!cart[id]) delete cart[id]; saveCart(); renderCart(); }

function openEl(el) { $('#ov').classList.add('open'); el.classList.add('open'); }
function closeAll() { ['#ov', '#modal', '#drawer'].forEach(s => $(s).classList.remove('open')); }
let viewing = null;
function view(id) {
  const p = byId(id); if (!p) return; viewing = p;
  $('#mImg').src = p.image_url || ''; $('#mImg').alt = p.name; $('#mCat').textContent = p.category;
  $('#mName').textContent = p.name; $('#mPrice').textContent = money(p.price); $('#mDesc').textContent = p.description || '';
  const out = MU.stockOf(p) === 0;
  $('#mAdd').disabled = out; $('#mWa').href = out ? '#' : waLink(singleMsg(p)); $('#mWa').style.opacity = out ? .5 : 1; $('#mWa').style.pointerEvents = out ? 'none' : '';
  openEl($('#modal'));
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-c],[data-add],[data-view],[data-inc],[data-dec]'); if (!t) return;
  if (t.dataset.c) { cat = t.dataset.c; renderCats(); renderGrid(); }
  else if (t.dataset.add) { change(t.dataset.add, 1); openEl($('#drawer')); }
  else if (t.dataset.view) view(t.dataset.view);
  else if (t.dataset.inc) change(t.dataset.inc, 1);
  else if (t.dataset.dec) change(t.dataset.dec, -1);
});
$('#q').addEventListener('input', e => { term = e.target.value; renderGrid(); });
$('#openCart').onclick = () => openEl($('#drawer'));
$('#closeCart').onclick = $('#closeModal').onclick = $('#ov').onclick = closeAll;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
$('#mAdd').onclick = () => { if (viewing) { change(viewing.id, 1); closeAll(); openEl($('#drawer')); } };
$('#send').onclick = () => {
  const es = cartEntries(); if (!es.length) return;
  const lines = es.map((e, i) => (i + 1) + '. ' + e.p.name + ' × ' + e.q + ' – ' + money(e.q * Number(e.p.price)));
  const total = es.reduce((a, e) => a + e.q * Number(e.p.price), 0);
  const msg = 'Hello ManaUpahar! 🎁\nI would like to place this order:\n\n' + lines.join('\n') + '\n\nTotal: ' + money(total) + '\n\nMy name:\nDelivery address:\nDelivery date:';
  window.open(waLink(msg), '_blank', 'noopener');
};

(async function init() {
  try {
    [products, settings] = await Promise.all([MU.getProducts(), MU.getSettings()]);
  } catch (err) {
    console.error(err);
    $('#grid').innerHTML = '<div class="empty">Could not load gifts right now. Please refresh in a moment.</div>';
    return;
  }
  $('#note').textContent = settings.note || '';
  $('#footNote').textContent = settings.note || '';
  renderCats(); renderGrid(); renderCart();
})();
</script>
</body>
</html>
